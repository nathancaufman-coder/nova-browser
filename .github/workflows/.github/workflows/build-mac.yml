name: Build NOVA Browser for Mac

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build Mac app
        run: npm run dist -- --mac dmg --universal
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-macOS
          path: release/*.dmg
          if-no-files-found: error
