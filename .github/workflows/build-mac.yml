name: Build NOVA for Mac

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: "nova-browser 3"
        run: npm install

      - name: Build NOVA
        working-directory: "nova-browser 3"
        run: npm run dist -- --mac dmg --universal

      - name: Upload Mac app
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-Mac
          path: "nova-browser 3/release/*.dmg"
